# T-027 Contextual FAB with WIP bottom sheets (US-04 "Contextual FAB" and "FAB hidden on Profile").
# Pre-req: ./gradlew :androidApp:installLocalDebug on the AVD, animations off:
#   adb shell settings put global animator_duration_scale 0
#   adb shell settings put global window_animation_scale 0
#   adb shell settings put global transition_animation_scale 0
# Run: maestro test --test-output-dir tests/e2e/screenshots tests/e2e/T-027.yaml
appId: io.github.lopezjavier.appfitness.local
---
- launchApp:
    clearState: true
# The tag is on the clickable container; the text is on its child node.
- assertVisible:
    id: "fab"
- assertVisible: "+ Registro"
# Diario: sheet closed with system back.
- tapOn:
    id: "fab"
- extendedWaitUntil:
    visible:
      id: "wip_sheet_title"
      text: "Añadir alimento"
    timeout: 5000
- assertVisible:
    id: "wip_sheet"
- assertVisible:
    id: "wip_sheet_handle"
- assertVisible:
    id: "wip_sheet_message"
- takeScreenshot: T-027_sheet_diary
- back
- extendedWaitUntil:
    notVisible:
      id: "wip_sheet"
    timeout: 5000
- assertVisible:
    id: "nav_bar"
- assertVisible:
    id: "nav_tab_diary"
    selected: true
# Entreno: sheet closed with a scrim tap.
- tapOn:
    id: "nav_tab_workout"
- tapOn:
    id: "fab"
- extendedWaitUntil:
    visible:
      id: "wip_sheet_title"
      text: "Empezar entreno"
    timeout: 5000
- tapOn:
    point: "50%,15%"
- extendedWaitUntil:
    notVisible:
      id: "wip_sheet"
    timeout: 5000
- assertVisible:
    id: "nav_tab_workout"
    selected: true
# Progreso: sheet closed by dragging down.
- tapOn:
    id: "nav_tab_progress"
- tapOn:
    id: "fab"
- extendedWaitUntil:
    visible:
      id: "wip_sheet_title"
      text: "Registrar peso"
    timeout: 5000
# Drag down entirely on the sheet (its top edge is at ~86 % of the screen height): the gesture neither
# starts nor ends on the scrim, so a scrim tap/release cannot be what closes it. A short drag is
# occasionally ignored by the sheet's anchored-draggable (touch slop), so repeat it until it closes.
- repeat:
    while:
      visible:
        id: "wip_sheet"
    times: 4
    commands:
      - swipe:
          start: "50%,88%"
          end: "50%,99%"
          duration: 60
      - waitForAnimationToEnd
- extendedWaitUntil:
    notVisible:
      id: "wip_sheet"
    timeout: 5000
- assertVisible:
    id: "nav_tab_progress"
    selected: true
# Perfil: no FAB.
- tapOn:
    id: "topbar_avatar"
- assertVisible:
    id: "profile_screen"
- assertNotVisible:
    id: "fab"
- assertNotVisible: "+ Registro"
- takeScreenshot: T-027_profile_no_fab
- back
- assertVisible:
    id: "fab"
# Footer reachable: the last item can be scrolled into view with the FAB on screen.
- tapOn:
    id: "nav_tab_diary"
- scrollUntilVisible:
    element:
      id: "diary_wip_footer"
    direction: DOWN
- assertVisible:
    id: "diary_wip_footer"
- assertVisible:
    id: "fab"
