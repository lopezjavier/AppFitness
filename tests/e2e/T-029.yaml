# T-029 Offline banner (US-04 "Offline"): "Sin conexión" banner appears offline, hides when back online.
# Pre-req: ./gradlew :androidApp:installLocalDebug on the AVD, animations off:
#   adb shell settings put global animator_duration_scale 0
#   adb shell settings put global window_animation_scale 0
#   adb shell settings put global transition_animation_scale 0
# Airplane mode: setAirplaneMode: enabled completes on our AVD (Medium_Phone_API_37.0,
# Maestro 2.11.0) without actually taking the device offline, so from a known "disabled"
# state we use toggleAirplaneMode to go offline and setAirplaneMode: disabled (works) to go back online.
# Run: maestro test --test-output-dir tests/e2e/screenshots tests/e2e/T-029.yaml
appId: io.github.lopezjavier.appfitness.local
tags:
  - shell
onFlowComplete:
  - setAirplaneMode: disabled
  - setOrientation: PORTRAIT
---
- setAirplaneMode: disabled
- setOrientation: PORTRAIT
- launchApp:
    clearState: true
- extendedWaitUntil:
    notVisible:
      id: "offline_banner"
    timeout: 5000
- assertVisible:
    id: "nav_tab_diary"
    selected: true
# Go offline.
- toggleAirplaneMode
- extendedWaitUntil:
    visible:
      id: "offline_banner"
    timeout: 10000
- assertVisible: "Sin conexión"
- takeScreenshot: T-029_offline_diary
# Still shown on Perfil.
- tapOn:
    id: "topbar_avatar"
- extendedWaitUntil:
    visible:
      id: "profile_screen"
    timeout: 5000
- assertVisible:
    id: "offline_banner"
- takeScreenshot: T-029_offline_profile
- back
# Still shown after a tab switch; app stays usable.
- tapOn:
    id: "nav_tab_workout"
- assertVisible:
    id: "nav_tab_workout"
    selected: true
- assertVisible:
    id: "offline_banner"
# Landscape rail while offline.
- setOrientation: LANDSCAPE_LEFT
- extendedWaitUntil:
    visible:
      id: "nav_rail"
    timeout: 10000
- assertVisible:
    id: "offline_banner"
- assertVisible:
    id: "nav_tab_diary"
- assertVisible:
    id: "nav_tab_workout"
- assertVisible:
    id: "nav_tab_progress"
- assertVisible:
    id: "fab"
- takeScreenshot: T-029_offline_rail
- setOrientation: PORTRAIT
# Back online.
- setAirplaneMode: disabled
- extendedWaitUntil:
    notVisible:
      id: "offline_banner"
    timeout: 20000
- takeScreenshot: T-029_online_again
