# T-034 Sign in with Google, session routing and sign out (US-05), local flavor Test login only.
# Pre-req: npx supabase start + db reset (seed), installLocalDebug, and
# adb shell pm grant io.github.lopezjavier.appfitness.local android.permission.ACCESS_LOCAL_NETWORK
# Not automatable (manual at Checkpoint E2-A): account picker and real Google sign-in.
# Run: maestro test --test-output-dir tests/e2e/screenshots tests/e2e/T-034.yaml
appId: io.github.lopezjavier.appfitness.local
tags:
  - auth
---
# Scenario: Test login -> Diario.
- launchApp:
    clearState: true
- assertVisible:
    id: "welcome_screen"
- runFlow: subflows/login.yaml
- assertVisible:
    id: "diary_screen"
- takeScreenshot: T-034_diary_after_login
# Scenario: Persistent session. Relaunch without clearing state lands on Diario, no login.
- stopApp
- launchApp
- extendedWaitUntil:
    visible:
      id: "diary_screen"
    timeout: 30000
- assertNotVisible:
    id: "welcome_screen"
# Scenario: Sign out -> confirmation -> Welcome.
- tapOn:
    id: "topbar_avatar"
- scrollUntilVisible:
    element:
      id: "profile_sign_out_button"
    timeout: 20000
- tapOn:
    id: "profile_sign_out_button"
- tapOn:
    id: "sign_out_dialog_confirm"
- extendedWaitUntil:
    visible:
      id: "welcome_screen"
    timeout: 20000
- takeScreenshot: T-034_welcome_after_sign_out
