# T-024 Data-viz components in the debug catalog: ring, macro bars, macro sliders, metric tiles, trend pills (US-03).
# Pre-req: ./gradlew :androidApp:installLocalDebug on the AVD, animations off:
#   adb shell settings put global animator_duration_scale 0
#   adb shell settings put global window_animation_scale 0
#   adb shell settings put global transition_animation_scale 0
# Run: maestro test --test-output-dir tests/e2e/screenshots tests/e2e/T-024.yaml
# Ring, bar and pill children are cleared/merged for accessibility, so they are asserted by id only.
appId: io.github.lopezjavier.appfitness.local
---
- launchApp:
    clearState: true
- tapOn:
    id: "topbar_avatar"
- assertVisible:
    id: "profile_screen"
- tapOn:
    id: "profile_catalog_button"
- assertVisible:
    id: "catalog_screen"
# Ring
- scrollUntilVisible:
    element:
      id: "catalog_section_ring"
    direction: DOWN
- scrollUntilVisible:
    element:
      id: "catalog_ring_empty"
    direction: DOWN
- assertVisible:
    id: "catalog_ring_empty"
- scrollUntilVisible:
    element:
      id: "catalog_ring_normal"
    direction: DOWN
- assertVisible:
    id: "catalog_ring_normal"
- takeScreenshot: T-024_ring_normal
- scrollUntilVisible:
    element:
      id: "catalog_ring_full"
    direction: DOWN
- assertVisible:
    id: "catalog_ring_full"
- scrollUntilVisible:
    element:
      id: "catalog_ring_over"
    direction: DOWN
- assertVisible:
    id: "catalog_ring_over"
- takeScreenshot: T-024_ring_over
# Macro bars
- scrollUntilVisible:
    element:
      id: "catalog_section_macro_bars"
    direction: DOWN
- scrollUntilVisible:
    element:
      id: "catalog_macro_bar_protein"
    direction: DOWN
- assertVisible:
    id: "catalog_macro_bar_protein"
- scrollUntilVisible:
    element:
      id: "catalog_macro_bar_carbs"
    direction: DOWN
- assertVisible:
    id: "catalog_macro_bar_carbs"
- scrollUntilVisible:
    element:
      id: "catalog_macro_bar_fat"
    direction: DOWN
- assertVisible:
    id: "catalog_macro_bar_fat"
- scrollUntilVisible:
    element:
      id: "catalog_macro_bar_over"
    direction: DOWN
- assertVisible:
    id: "catalog_macro_bar_over"
- takeScreenshot: T-024_macro_bars
# Macro sliders
- scrollUntilVisible:
    element:
      id: "catalog_section_macro_sliders"
    direction: DOWN
- scrollUntilVisible:
    element:
      id: "catalog_macro_slider_protein"
    direction: DOWN
- assertVisible:
    id: "catalog_macro_slider_protein"
- assertVisible: "30 %"
- assertVisible: "180 g · 720 kcal"
- scrollUntilVisible:
    element:
      id: "catalog_macro_slider_fat"
    direction: DOWN
- scrollUntilVisible:
    element:
      id: "catalog_macro_slider_carbs"
    direction: DOWN
- assertVisible:
    id: "catalog_macro_slider_carbs"
- assertVisible:
    id: "catalog_macro_slider_fat"
- assertVisible: "45 %"
- assertVisible: "270 g · 1.080 kcal"
- assertVisible: "25 %"
- assertVisible: "67 g · 600 kcal"
- scrollUntilVisible:
    element:
      id: "catalog_macro_slider_disabled"
    direction: DOWN
- assertVisible:
    id: "catalog_macro_slider_disabled"
    enabled: false
- assertVisible: "40 %"
- takeScreenshot: T-024_sliders_before
# Interact with the protein slider (scroll back up so it is fully on screen)
- scrollUntilVisible:
    element:
      id: "catalog_macro_slider_protein"
    direction: UP
- assertVisible:
    id: "catalog_macro_slider_protein"
    enabled: true
- swipe:
    from:
      id: "catalog_macro_slider_protein"
    direction: RIGHT
- assertNotVisible: "30 %"
- assertNotVisible: "180 g · 720 kcal"
- takeScreenshot: T-024_sliders_after
# Metric tiles
- scrollUntilVisible:
    element:
      id: "catalog_section_metric_tiles"
    direction: DOWN
- scrollUntilVisible:
    element:
      id: "catalog_metric_tile_goal"
    direction: DOWN
- scrollUntilVisible:
    element:
      id: "catalog_metric_tile_fat"
    direction: DOWN
- assertVisible:
    id: "catalog_metric_tile_fat"
- assertVisible:
    id: "catalog_metric_tile_goal"
- takeScreenshot: T-024_metric_tiles
# Trend pills
- scrollUntilVisible:
    element:
      id: "catalog_section_trend_pills"
    direction: DOWN
- scrollUntilVisible:
    element:
      id: "catalog_trend_neutral"
    direction: DOWN
- scrollUntilVisible:
    element:
      id: "catalog_trend_favorable"
    direction: DOWN
- assertVisible:
    id: "catalog_trend_favorable"
- scrollUntilVisible:
    element:
      id: "catalog_trend_unfavorable"
    direction: DOWN
- assertVisible:
    id: "catalog_trend_unfavorable"
- scrollUntilVisible:
    element:
      id: "catalog_trend_caution"
    direction: DOWN
- assertVisible:
    id: "catalog_trend_caution"
- assertVisible:
    id: "catalog_trend_neutral"
- assertVisible: "−0,45 kg esta semana"
- assertVisible: "+0,30 kg esta semana"
- assertVisible: "+0,35 kg esta semana"
- assertVisible: "Sin datos suficientes"
- takeScreenshot: T-024_trend_pills
# Back
- tapOn:
    id: "topbar_back"
- assertVisible:
    id: "profile_screen"
- back
- assertVisible:
    id: "nav_tab_diary"
    selected: true
