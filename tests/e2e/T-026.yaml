# T-026 Empty/error states, shell components and catalog completeness (US-03).
# Pre-req: ./gradlew :androidApp:installLocalDebug on the AVD, animations off:
#   adb shell settings put global animator_duration_scale 0
#   adb shell settings put global window_animation_scale 0
#   adb shell settings put global transition_animation_scale 0
# Run: maestro test --test-output-dir tests/e2e/screenshots tests/e2e/T-026.yaml
appId: io.github.lopezjavier.appfitness.local
tags:
  - catalog
---
- launchApp:
    clearState: true
- tapOn:
    id: "topbar_avatar"
- assertVisible:
    id: "profile_screen"
- tapOn:
    id: "profile_catalog_button"
- assertVisible:
    id: "catalog_screen"
# Completeness walk: every section 6 component heading, in catalog order
- scrollUntilVisible:
    element:
      id: "catalog_section_cards"
    direction: DOWN
    visibilityPercentage: 20
    # long catalog: the 20 s default is not enough
    timeout: 60000
- assertVisible:
    id: "catalog_section_cards"
- scrollUntilVisible:
    element:
      id: "catalog_section_buttons"
    direction: DOWN
    visibilityPercentage: 20
    # long catalog: the 20 s default is not enough
    timeout: 60000
- assertVisible:
    id: "catalog_section_buttons"
- scrollUntilVisible:
    element:
      id: "catalog_section_chips"
    direction: DOWN
    visibilityPercentage: 20
    # long catalog: the 20 s default is not enough
    timeout: 60000
- assertVisible:
    id: "catalog_section_chips"
- scrollUntilVisible:
    element:
      id: "catalog_section_segmented"
    direction: DOWN
    visibilityPercentage: 20
    # long catalog: the 20 s default is not enough
    timeout: 60000
- assertVisible:
    id: "catalog_section_segmented"
- scrollUntilVisible:
    element:
      id: "catalog_section_ring"
    direction: DOWN
    visibilityPercentage: 20
    # long catalog: the 20 s default is not enough
    timeout: 60000
- assertVisible:
    id: "catalog_section_ring"
- scrollUntilVisible:
    element:
      id: "catalog_section_macro_bars"
    direction: DOWN
    visibilityPercentage: 20
    # long catalog: the 20 s default is not enough
    timeout: 60000
- assertVisible:
    id: "catalog_section_macro_bars"
- scrollUntilVisible:
    element:
      id: "catalog_section_macro_sliders"
    direction: DOWN
    visibilityPercentage: 20
    # long catalog: the 20 s default is not enough
    timeout: 60000
- assertVisible:
    id: "catalog_section_macro_sliders"
- scrollUntilVisible:
    element:
      id: "catalog_section_metric_tiles"
    direction: DOWN
    visibilityPercentage: 20
    # long catalog: the 20 s default is not enough
    timeout: 60000
- assertVisible:
    id: "catalog_section_metric_tiles"
- scrollUntilVisible:
    element:
      id: "catalog_section_trend_pills"
    direction: DOWN
    visibilityPercentage: 20
    # long catalog: the 20 s default is not enough
    timeout: 60000
- assertVisible:
    id: "catalog_section_trend_pills"
- scrollUntilVisible:
    element:
      id: "catalog_section_number_input"
    direction: DOWN
    visibilityPercentage: 20
    # long catalog: the 20 s default is not enough
    timeout: 60000
- assertVisible:
    id: "catalog_section_number_input"
- scrollUntilVisible:
    element:
      id: "catalog_section_set_checkbox"
    direction: DOWN
    visibilityPercentage: 20
    # long catalog: the 20 s default is not enough
    timeout: 60000
- assertVisible:
    id: "catalog_section_set_checkbox"
- scrollUntilVisible:
    element:
      id: "catalog_section_set_rows"
    direction: DOWN
    visibilityPercentage: 20
    # long catalog: the 20 s default is not enough
    timeout: 60000
- assertVisible:
    id: "catalog_section_set_rows"
- scrollUntilVisible:
    element:
      id: "catalog_section_rest_timer"
    direction: DOWN
    visibilityPercentage: 20
    # long catalog: the 20 s default is not enough
    timeout: 60000
- assertVisible:
    id: "catalog_section_rest_timer"
- scrollUntilVisible:
    element:
      id: "catalog_section_state_messages"
    direction: DOWN
    visibilityPercentage: 20
    # long catalog: the 20 s default is not enough
    timeout: 60000
- assertVisible:
    id: "catalog_section_state_messages"
- scrollUntilVisible:
    element:
      id: "catalog_section_top_bar"
    direction: DOWN
    visibilityPercentage: 20
    # long catalog: the 20 s default is not enough
    timeout: 60000
- assertVisible:
    id: "catalog_section_top_bar"
- scrollUntilVisible:
    element:
      id: "catalog_section_navigation"
    direction: DOWN
    visibilityPercentage: 20
    # long catalog: the 20 s default is not enough
    timeout: 60000
- assertVisible:
    id: "catalog_section_navigation"
- scrollUntilVisible:
    element:
      id: "catalog_section_skeleton"
    direction: DOWN
    visibilityPercentage: 20
    # long catalog: the 20 s default is not enough
    timeout: 60000
- assertVisible:
    id: "catalog_section_skeleton"
- scrollUntilVisible:
    element:
      id: "catalog_section_wip"
    direction: DOWN
    visibilityPercentage: 20
    # long catalog: the 20 s default is not enough
    timeout: 60000
- assertVisible:
    id: "catalog_section_wip"
- scrollUntilVisible:
    element:
      id: "catalog_section_theme"
    direction: DOWN
    visibilityPercentage: 20
    # long catalog: the 20 s default is not enough
    timeout: 60000
- assertVisible:
    id: "catalog_section_theme"
# Back up to the state messages
- scrollUntilVisible:
    element:
      id: "catalog_section_state_messages"
    direction: UP
    visibilityPercentage: 20
    # long catalog: the 20 s default is not enough
    timeout: 60000
- scrollUntilVisible:
    element:
      id: "catalog_empty_state_action"
    direction: DOWN
    visibilityPercentage: 20
    # long catalog: the 20 s default is not enough
    timeout: 60000
- assertVisible:
    id: "catalog_empty_state_title"
- assertVisible:
    id: "catalog_empty_state_message"
- assertVisible:
    id: "catalog_empty_state_action"
- tapOn:
    id: "catalog_empty_state_action"
- scrollUntilVisible:
    element:
      id: "catalog_error_state_action"
    direction: DOWN
    visibilityPercentage: 20
    # long catalog: the 20 s default is not enough
    timeout: 60000
- scroll
- assertVisible:
    id: "catalog_error_state_title"
- assertVisible:
    id: "catalog_error_state_message"
- assertVisible:
    id: "catalog_error_state_action"
- assertVisible: "Reintentar"
# the empty-state tap already counted once
- assertVisible: "Acciones pulsadas: 1"
- tapOn:
    id: "catalog_error_state_action"
- assertVisible: "Acciones pulsadas: 2"
- takeScreenshot: T-026_state_messages
- scrollUntilVisible:
    element:
      id: "catalog_topbar_tabs_avatar"
    direction: DOWN
    centerElement: true
    # long catalog: the 20 s default is not enough
    timeout: 60000
- tapOn:
    id: "catalog_topbar_tabs_avatar"
# assert after each tap: a second tap sent during recomposition was occasionally dropped
- extendedWaitUntil:
    visible: "Pulsaciones: 1"
    timeout: 5000
- tapOn:
    id: "catalog_topbar_full_back"
- extendedWaitUntil:
    visible: "Pulsaciones: 2"
    timeout: 5000
# no navigation happened: the real shell top bar is still the catalog one
- assertVisible:
    id: "topbar_back"
- assertVisible:
    id: "catalog_screen"
- takeScreenshot: T-026_top_bar
- scrollUntilVisible:
    element:
      id: "catalog_nav_tab_workout"
    direction: DOWN
    visibilityPercentage: 20
    # long catalog: the 20 s default is not enough
    timeout: 60000
- tapOn:
    id: "catalog_nav_tab_workout"
- assertVisible:
    id: "catalog_nav_tab_workout"
    selected: true
- assertVisible:
    id: "catalog_nav_tab_diary"
    selected: false
- takeScreenshot: T-026_navigation
- scrollUntilVisible:
    element:
      id: "catalog_section_skeleton"
    direction: DOWN
    visibilityPercentage: 20
    # long catalog: the 20 s default is not enough
    timeout: 60000
- scroll
- assertVisible:
    id: "catalog_skeleton"
- scrollUntilVisible:
    element:
      id: "catalog_section_wip"
    direction: DOWN
    visibilityPercentage: 20
# the section can be only partly on screen; scroll on to the message itself
    # long catalog: the 20 s default is not enough
    timeout: 60000
- scrollUntilVisible:
    element:
      id: "catalog_wip_message"
    direction: DOWN
    # long catalog: the 20 s default is not enough
    timeout: 60000
- scrollUntilVisible:
    element:
      id: "catalog_section_theme"
    direction: DOWN
    visibilityPercentage: 20
    # long catalog: the 20 s default is not enough
    timeout: 60000
- scroll
- assertVisible:
    id: "catalog_theme_colors"
- takeScreenshot: T-026_theme
# Carry-over visual checks (screenshots): opaque disabled slider thumb, segmented selector at 130 % font
- scrollUntilVisible:
    element:
      id: "catalog_macro_slider_disabled"
    direction: UP
    visibilityPercentage: 20
    # long scroll back up from the end of the catalog; the 20 s default is not enough
    timeout: 60000
- takeScreenshot: T-026_slider_disabled
- back
- assertVisible:
    id: "profile_screen"
- tapOn:
    id: "topbar_back"
- assertVisible:
    id: "nav_tab_diary"
    selected: true
