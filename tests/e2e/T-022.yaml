# T-022 Top App Bar with section title and avatar (US-04 "Launch" and "The avatar opens Profile"). QA owns the final version.
# Pre-req: ./gradlew :androidApp:installLocalDebug on the AVD (no local Supabase needed).
# Run with emulator animations off so the infinite skeleton shimmer does not slow the taps:
#   adb shell settings put global animator_duration_scale 0
#   adb shell settings put global window_animation_scale 0
#   adb shell settings put global transition_animation_scale 0
# Run: maestro test --test-output-dir tests/e2e/screenshots tests/e2e/T-022.yaml
# Manual check: launch screenshot has the title in Jakarta 20 sp, avatar circle on the right, hairline
# under the bar, nothing under the status bar; T-022_profile has a back arrow, no avatar and no bottom bar.
appId: io.github.lopezjavier.appfitness.local
---
- launchApp:
    clearState: true
- assertVisible:
    id: "topbar"
- assertVisible:
    id: "topbar_title"
    text: "Diario"
- assertVisible:
    id: "topbar_avatar"
- assertVisible:
    id: "nav_bar"
- assertVisible:
    id: "nav_tab_diary"
    selected: true
- assertVisible:
    id: "nav_tab_workout"
- assertVisible:
    id: "nav_tab_progress"
- assertNotVisible:
    id: "nav_tab_profile"
- assertVisible:
    id: "diary_screen"
- takeScreenshot: T-022_launch
# The title follows the tab.
- tapOn:
    id: "nav_tab_workout"
- assertVisible:
    id: "topbar_title"
    text: "Entreno"
- tapOn:
    id: "nav_tab_progress"
- assertVisible:
    id: "topbar_title"
    text: "Progreso"
# State to preserve: scroll Progreso down.
- scrollUntilVisible:
    element:
      id: "progress_wip_footer"
    direction: DOWN
# The avatar opens Profile as a full screen with a back arrow and no bottom bar.
- tapOn:
    id: "topbar_avatar"
- assertVisible:
    id: "profile_screen"
- assertVisible:
    id: "topbar_title"
    text: "Perfil"
- assertVisible:
    id: "topbar_back"
- assertVisible: "Volver"
- assertNotVisible:
    id: "nav_bar"
- assertNotVisible:
    id: "topbar_avatar"
- takeScreenshot: T-022_profile
# The back arrow returns to Progreso with its scroll position.
- tapOn:
    id: "topbar_back"
- assertVisible:
    id: "nav_tab_progress"
    selected: true
- assertVisible:
    id: "topbar_title"
    text: "Progreso"
- assertVisible:
    id: "progress_wip_footer"
- assertNotVisible:
    id: "progress_wip_message"
# Avatar from the start tab, then system back returns to Diario.
- tapOn:
    id: "nav_tab_diary"
- scrollUntilVisible:
    element:
      id: "diary_wip_footer"
    direction: DOWN
- tapOn:
    id: "topbar_avatar"
- assertVisible:
    id: "profile_screen"
- back
- assertVisible:
    id: "nav_tab_diary"
    selected: true
- assertVisible:
    id: "diary_wip_footer"
- assertNotVisible:
    id: "diary_wip_message"
- assertVisible:
    id: "topbar_title"
    text: "Diario"
# Back stack sanity: Profile leaves no extra entry.
- tapOn:
    id: "nav_tab_workout"
- tapOn:
    id: "topbar_avatar"
- assertVisible:
    id: "profile_screen"
- back
- assertVisible:
    id: "nav_tab_workout"
    selected: true
- back
- assertVisible:
    id: "nav_tab_diary"
    selected: true
# Accessibility label of the avatar.
- assertVisible: "Abrir perfil"
# Back on the start tab leaves the app (Profile left no entry behind).
- back
- assertNotVisible:
    id: "nav_bar"
