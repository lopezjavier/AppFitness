# T-023 Debug component catalog: card, buttons, chips, segmented selector (US-03). QA owns the final version.
# Pre-req: ./gradlew :androidApp:installLocalDebug on the AVD, animations off:
#   adb shell settings put global animator_duration_scale 0
#   adb shell settings put global window_animation_scale 0
#   adb shell settings put global transition_animation_scale 0
# Run: maestro test --test-output-dir tests/e2e/screenshots tests/e2e/T-023.yaml
# Chips and segments use Role.RadioButton, so Android exposes selection as "checked".
# Manual: prod flavor has no catalog entry (covered by CatalogAvailabilityTest in testProd).
appId: io.github.lopezjavier.appfitness.local
tags:
  - catalog
---
- launchApp:
    clearState: true
- runFlow: subflows/login.yaml
- assertVisible:
    id: "topbar_avatar"
- tapOn:
    id: "topbar_avatar"
- assertVisible:
    id: "profile_screen"
- assertVisible:
    id: "topbar_title"
    text: "Perfil"
# The label is a child node of the tagged button, so id and text are asserted separately.
- assertVisible:
    id: "profile_catalog_button"
- assertVisible: "Catálogo de componentes"
- tapOn:
    id: "profile_catalog_button"
- assertVisible:
    id: "topbar_title"
    text: "Catálogo de componentes"
- assertVisible:
    id: "catalog_screen"
- assertVisible:
    id: "topbar_back"
- assertNotVisible:
    id: "nav_bar"
- assertNotVisible:
    id: "topbar_avatar"
# Cards
- assertVisible:
    id: "catalog_section_cards"
- assertVisible:
    id: "catalog_card"
- takeScreenshot: T-023_cards
# Buttons
- scrollUntilVisible:
    element:
      id: "catalog_section_buttons"
    direction: DOWN
- scrollUntilVisible:
    element:
      id: "catalog_button_primary_enabled"
    direction: DOWN
- assertVisible:
    id: "catalog_button_primary_enabled"
    enabled: true
- assertVisible:
    id: "catalog_button_primary_disabled"
    enabled: false
- assertVisible:
    id: "catalog_button_primary_pressed"
    enabled: true
- takeScreenshot: T-023_buttons_primary
- scrollUntilVisible:
    element:
      id: "catalog_button_secondary_enabled"
    direction: DOWN
- assertVisible:
    id: "catalog_button_secondary_enabled"
    enabled: true
- scrollUntilVisible:
    element:
      id: "catalog_button_secondary_disabled"
    direction: DOWN
- assertVisible:
    id: "catalog_button_secondary_disabled"
    enabled: false
- scrollUntilVisible:
    element:
      id: "catalog_button_secondary_pressed"
    direction: DOWN
- assertVisible:
    id: "catalog_button_secondary_pressed"
    enabled: true
- takeScreenshot: T-023_buttons_secondary
- scrollUntilVisible:
    element:
      id: "catalog_button_ghost_enabled"
    direction: DOWN
- assertVisible:
    id: "catalog_button_ghost_enabled"
    enabled: true
- scrollUntilVisible:
    element:
      id: "catalog_button_ghost_disabled"
    direction: DOWN
- assertVisible:
    id: "catalog_button_ghost_disabled"
    enabled: false
- scrollUntilVisible:
    element:
      id: "catalog_button_ghost_pressed"
    direction: DOWN
- assertVisible:
    id: "catalog_button_ghost_pressed"
    enabled: true
- takeScreenshot: T-023_buttons_ghost
- tapOn:
    id: "catalog_button_ghost_enabled"
- assertVisible:
    id: "catalog_screen"
# Chips
- scrollUntilVisible:
    element:
      id: "catalog_chip_row"
    direction: DOWN
- assertVisible:
    id: "catalog_chip_1w"
- assertVisible:
    id: "catalog_chip_1m"
    checked: true
- assertVisible:
    id: "catalog_chip_3m"
    checked: false
- assertVisible:
    id: "catalog_chip_1y"
- tapOn:
    id: "catalog_chip_3m"
- assertVisible:
    id: "catalog_chip_3m"
    checked: true
- assertVisible:
    id: "catalog_chip_1m"
    checked: false
# Segmented
- scrollUntilVisible:
    element:
      id: "catalog_segmented"
    direction: DOWN
- assertVisible: "Déficit"
- assertVisible: "Mantenimiento"
- assertVisible: "Superávit"
- assertVisible:
    id: "catalog_segment_maintenance"
    checked: true
- tapOn:
    id: "catalog_segment_deficit"
- assertVisible:
    id: "catalog_segment_deficit"
    checked: true
- assertVisible:
    id: "catalog_segment_maintenance"
    checked: false
- takeScreenshot: T-023_chips_segmented
# Back stack
- tapOn:
    id: "topbar_back"
- assertVisible:
    id: "profile_screen"
- assertVisible:
    id: "topbar_title"
    text: "Perfil"
- back
- assertVisible:
    id: "nav_tab_diary"
    selected: true
# Re-entry, system back from the catalog
- tapOn:
    id: "topbar_avatar"
- tapOn:
    id: "profile_catalog_button"
- assertVisible:
    id: "catalog_screen"
- back
- assertVisible:
    id: "profile_screen"
