# T-028 Adaptive shell: NavigationRail at >= 600 dp wide (US-04 "Tablet layout").
# Runs on the phone AVD: in landscape it is >= 600 dp wide, so the rail appears.
# Pre-req: ./gradlew :androidApp:installLocalDebug on the AVD, animations off.
# Run: maestro test --test-output-dir tests/e2e/screenshots tests/e2e/T-028.yaml
# The PORTRAIT step is last so the following flows start upright.
appId: io.github.lopezjavier.appfitness.local
tags:
  - shell
---
# Start upright even if a previous aborted run left the device rotated.
- setOrientation: PORTRAIT
- launchApp:
    clearState: true
- setOrientation: LANDSCAPE_LEFT
# Rail layout: rail with the FAB inside, no bottom bar.
- extendedWaitUntil:
    visible:
      id: "nav_rail"
    timeout: 10000
- assertNotVisible:
    id: "nav_bar"
- assertVisible:
    id: "fab"
- assertVisible: "+ Registro"
- assertVisible:
    id: "nav_tab_diary"
    selected: true
- takeScreenshot: T-028_rail_diary
# Tabs switch.
- tapOn:
    id: "nav_tab_workout"
- assertVisible:
    id: "nav_tab_workout"
    selected: true
- tapOn:
    id: "nav_tab_progress"
- assertVisible:
    id: "nav_tab_progress"
    selected: true
- tapOn:
    id: "nav_tab_workout"
- assertVisible:
    id: "nav_tab_workout"
    selected: true
# Contextual FAB opens its sheet from the rail.
- tapOn:
    id: "fab"
- extendedWaitUntil:
    visible:
      id: "wip_sheet_title"
      text: "Empezar entreno"
    timeout: 5000
- takeScreenshot: T-028_rail_sheet
- back
- extendedWaitUntil:
    notVisible:
      id: "wip_sheet"
    timeout: 5000
# Perfil hides rail and FAB; back restores them.
- tapOn:
    id: "topbar_avatar"
- assertVisible:
    id: "profile_screen"
- assertNotVisible:
    id: "nav_rail"
- assertNotVisible:
    id: "fab"
- assertNotVisible: "+ Registro"
- takeScreenshot: T-028_profile
- back
- extendedWaitUntil:
    visible:
      id: "nav_rail"
    timeout: 5000
- assertVisible:
    id: "nav_tab_workout"
    selected: true
# Footer reachable without an empty band below it.
- tapOn:
    id: "nav_tab_diary"
- scrollUntilVisible:
    element:
      id: "diary_wip_footer"
    direction: DOWN
    speed: 70
    timeout: 90000
- assertVisible:
    id: "diary_wip_footer"
- takeScreenshot: T-028_rail_footer
# Back to Entreno, then rotate to portrait: bar returns and the tab is preserved.
- tapOn:
    id: "nav_tab_workout"
- setOrientation: PORTRAIT
- extendedWaitUntil:
    visible:
      id: "nav_bar"
    timeout: 10000
- assertNotVisible:
    id: "nav_rail"
- assertVisible:
    id: "nav_tab_workout"
    selected: true
- assertVisible:
    id: "fab"
- takeScreenshot: T-028_portrait_bar
