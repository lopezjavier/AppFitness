# Login subflow: from a fresh (cleared) install, sign in with the local-only "Test login" button
# and wait for Diario. The seeded test@appfitness.local user is already onboarded.
# The caller launches the app (launchApp with clearState: true) before running this subflow.
appId: io.github.lopezjavier.appfitness.local
---
- extendedWaitUntil:
    visible:
      id: "welcome_test_login_button"
    timeout: 20000
- tapOn:
    id: "welcome_test_login_button"
- extendedWaitUntil:
    visible:
      id: "diary_screen"
    timeout: 30000
