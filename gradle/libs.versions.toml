[versions]
# Build toolchain. Kotlin 2.4.21 fully supports Gradle 7.6.3-9.7.0 and AGP 8.5.2-9.3.1
# (kotlinlang.org/docs/gradle-configure-project.html); AGP 9.3 needs Gradle >= 9.5.0
# and supports up to API 37 (developer.android.com/build/releases/agp-9-3-0-release-notes).
agp = "9.3.3"
kotlin = "2.4.21"
compose-multiplatform = "1.12.1"
# Latest stable Material3 for Compose Multiplatform; CMP 1.12.1 itself maps to the
# 1.12.0-alpha03 pre-release, which the stable-only rule excludes.
compose-material3 = "1.9.0"

# Android SDK levels (ADR-21: minSdk 26 for Health Connect)
android-compileSdk = "37"
android-targetSdk = "37"
android-minSdk = "26"

# Libraries
androidx-activity = "1.13.0"
koin-bom = "4.2.2"
kotlinx-coroutines = "1.11.0"
kotlinx-serialization = "1.11.0"
kotlinx-datetime = "0.8.0"
navigation-compose = "2.9.2"
junit = "4.13.2"

# Lint (T-016). Stable releases only.
ktlint-gradle = "14.2.0"
ktlint = "1.8.0"
# detekt 2.x is still alpha (2.0.0-alpha.6), so the stable line is 1.23.8 (compiled with Kotlin 2.0.21).
detekt = "1.23.8"
detekt-kotlin = "2.0.21"
# Last compose-rules release built for detekt 1.23.x (0.5+ targets detekt 2.0 alphas).
compose-rules = "0.4.28"

[libraries]
# Compose Multiplatform (explicit coordinates; the compose.* accessors are deprecated)
compose-runtime = { module = "org.jetbrains.compose.runtime:runtime", version.ref = "compose-multiplatform" }
compose-foundation = { module = "org.jetbrains.compose.foundation:foundation", version.ref = "compose-multiplatform" }
compose-ui = { module = "org.jetbrains.compose.ui:ui", version.ref = "compose-multiplatform" }
compose-material3 = { module = "org.jetbrains.compose.material3:material3", version.ref = "compose-material3" }

androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "androidx-activity" }

koin-bom = { module = "io.insert-koin:koin-bom", version.ref = "koin-bom" }
koin-core = { module = "io.insert-koin:koin-core" }
koin-android = { module = "io.insert-koin:koin-android" }
koin-compose = { module = "io.insert-koin:koin-compose" }
koin-compose-viewmodel = { module = "io.insert-koin:koin-compose-viewmodel" }
koin-test = { module = "io.insert-koin:koin-test" }

kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "kotlinx-coroutines" }
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "kotlinx-coroutines" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "kotlinx-serialization" }
kotlinx-datetime = { module = "org.jetbrains.kotlinx:kotlinx-datetime", version.ref = "kotlinx-datetime" }
navigation-compose = { module = "org.jetbrains.androidx.navigation:navigation-compose", version.ref = "navigation-compose" }

kotlin-test = { module = "org.jetbrains.kotlin:kotlin-test", version.ref = "kotlin" }
kotlin-test-junit = { module = "org.jetbrains.kotlin:kotlin-test-junit", version.ref = "kotlin" }
junit = { module = "junit:junit", version.ref = "junit" }

compose-rules-detekt = { module = "io.nlopez.compose.rules:detekt", version.ref = "compose-rules" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-kotlin-multiplatform-library = { id = "com.android.kotlin.multiplatform.library", version.ref = "agp" }
kotlin-multiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
compose-multiplatform = { id = "org.jetbrains.compose", version.ref = "compose-multiplatform" }
ktlint = { id = "org.jlleitschuh.gradle.ktlint", version.ref = "ktlint-gradle" }
detekt = { id = "io.gitlab.arturbosch.detekt", version.ref = "detekt" }
