[versions]
# Build toolchain. The KGP 2.4.21 compatibility table lists Gradle 7.6.3-9.7.0 and
# AGP 8.5.2-9.3.1 as tested (kotlinlang.org/docs/gradle-configure-project.html).
# Gradle 9.7.1 and AGP 9.3.3 are patch releases above those upper bounds and build with
# no compatibility warning (checked in T-015). AGP 9.3 needs Gradle >= 9.5.0 and supports
# up to API 37 (developer.android.com/build/releases/agp-9-3-0-release-notes).
agp = "9.3.3"
kotlin = "2.4.21"
compose-multiplatform = "1.12.1"
# Kept 1.9.0 (latest stable) with CMP 1.12.1, checked in T-020: androidRuntimeClasspath
# resolves androidx.compose.material3 1.4.0; ui/foundation are only upgraded to 1.12.1 by
# conflict resolution (no downgrade, no FAILED). The officially paired 1.12.0-alpha03 is a
# pre-release, which the stable-only rule excludes.
compose-material3 = "1.9.0"

# Android SDK levels (ADR-21: minSdk 26 for Health Connect)
android-compileSdk = "37"
android-targetSdk = "37"
android-minSdk = "26"

# Libraries
androidx-activity = "1.13.0"
koin-bom = "4.2.2"
kotlinx-coroutines = "1.11.0"
kotlinx-serialization = "1.11.0"
kotlinx-datetime = "0.8.0"
# Kept 2.9.2 (latest stable; 2.10.0 is only rc01) with CMP 1.12.1, checked in T-021: androidRuntimeClasspath
# resolves it with lifecycle 2.9.6; compose ui/foundation are only raised to 1.12.1 (no downgrade, no
# FAILED) and the shell runs on the emulator.
navigation-compose = "2.9.2"
# JetBrains lifecycle 2.9.6 (latest stable 2.9.x) is the version navigation-compose 2.9.2 already resolves
# (T-021), so viewmodel-compose and runtime-compose add no upgrade or downgrade (checked in T-029).
jetbrains-lifecycle = "2.9.6"
# Latest stable (1.2.1, T-029); Flow assertions in commonTest.
turbine = "1.2.1"
junit = "4.13.2"
# Compose UI semantics/touch-target tests on the JVM (T-026 spike). ui-test-junit4/manifest follow the
# androidx compose ui version that androidRuntimeClasspath resolves (1.12.1). Robolectric tests pin an
# SDK level via robolectric.properties when the latest stable does not support compileSdk yet.
robolectric = "4.17"
androidx-compose-ui-test = "1.12.1"

# Lint (T-016). Stable releases only.
ktlint-gradle = "14.2.0"
ktlint = "1.8.0"
# detekt 2.x is still alpha (2.0.0-alpha.6), so the stable line is 1.23.8 (compiled with Kotlin 2.0.21).
detekt = "1.23.8"
detekt-kotlin = "2.0.21"
# Last compose-rules release built for detekt 1.23.x (0.5+ targets detekt 2.0 alphas).
compose-rules = "0.4.28"

[libraries]
# Compose Multiplatform (explicit coordinates; the compose.* accessors are deprecated)
compose-runtime = { module = "org.jetbrains.compose.runtime:runtime", version.ref = "compose-multiplatform" }
compose-foundation = { module = "org.jetbrains.compose.foundation:foundation", version.ref = "compose-multiplatform" }
compose-ui = { module = "org.jetbrains.compose.ui:ui", version.ref = "compose-multiplatform" }
compose-material3 = { module = "org.jetbrains.compose.material3:material3", version.ref = "compose-material3" }
compose-ui-tooling-preview = { module = "org.jetbrains.compose.ui:ui-tooling-preview", version.ref = "compose-multiplatform" }
compose-components-resources = { module = "org.jetbrains.compose.components:components-resources", version.ref = "compose-multiplatform" }

androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "androidx-activity" }

koin-bom = { module = "io.insert-koin:koin-bom", version.ref = "koin-bom" }
koin-core = { module = "io.insert-koin:koin-core" }
koin-android = { module = "io.insert-koin:koin-android" }
koin-compose = { module = "io.insert-koin:koin-compose" }
koin-compose-viewmodel = { module = "io.insert-koin:koin-compose-viewmodel" }
koin-test = { module = "io.insert-koin:koin-test" }

kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "kotlinx-coroutines" }
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "kotlinx-coroutines" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "kotlinx-serialization" }
kotlinx-serialization-core = { module = "org.jetbrains.kotlinx:kotlinx-serialization-core", version.ref = "kotlinx-serialization" }
kotlinx-datetime = { module = "org.jetbrains.kotlinx:kotlinx-datetime", version.ref = "kotlinx-datetime" }
navigation-compose = { module = "org.jetbrains.androidx.navigation:navigation-compose", version.ref = "navigation-compose" }
lifecycle-viewmodel-compose = { module = "org.jetbrains.androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "jetbrains-lifecycle" }
lifecycle-runtime-compose = { module = "org.jetbrains.androidx.lifecycle:lifecycle-runtime-compose", version.ref = "jetbrains-lifecycle" }
turbine = { module = "app.cash.turbine:turbine", version.ref = "turbine" }

kotlin-test = { module = "org.jetbrains.kotlin:kotlin-test", version.ref = "kotlin" }
kotlin-test-junit = { module = "org.jetbrains.kotlin:kotlin-test-junit", version.ref = "kotlin" }
junit = { module = "junit:junit", version.ref = "junit" }

robolectric = { module = "org.robolectric:robolectric", version.ref = "robolectric" }
androidx-compose-ui-test = { module = "androidx.compose.ui:ui-test", version.ref = "androidx-compose-ui-test" }
androidx-compose-ui-test-junit4 = { module = "androidx.compose.ui:ui-test-junit4", version.ref = "androidx-compose-ui-test" }
androidx-compose-ui-test-manifest = { module = "androidx.compose.ui:ui-test-manifest", version.ref = "androidx-compose-ui-test" }

compose-rules-detekt = { module = "io.nlopez.compose.rules:detekt", version.ref = "compose-rules" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-kotlin-multiplatform-library = { id = "com.android.kotlin.multiplatform.library", version.ref = "agp" }
kotlin-multiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
compose-multiplatform = { id = "org.jetbrains.compose", version.ref = "compose-multiplatform" }
ktlint = { id = "org.jlleitschuh.gradle.ktlint", version.ref = "ktlint-gradle" }
detekt = { id = "io.gitlab.arturbosch.detekt", version.ref = "detekt" }
