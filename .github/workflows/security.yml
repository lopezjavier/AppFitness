name: security

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write # gitleaks comments on the PR lines that leak a secret

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # Fails when a committed file's line endings don't match .gitattributes (e.g. a bot
      # committing CRLF through the API). Lives here because this job runs on every PR.
      # Fix locally with: git add --renormalize . && git commit
      - name: Line endings match .gitattributes
        run: |
          git add --renormalize .
          if ! git diff --cached --quiet; then
            echo "::error::Files not normalized per .gitattributes:"
            git diff --cached --name-only
            exit 1
          fi
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Text files are clean UTF-8 (no BOM, CRLF or mojibake)
        run: bash scripts/check-text-encoding.sh
      - name: Delivery script unit tests
        run: python3 -m unittest scripts/test_deliver_apk.py
