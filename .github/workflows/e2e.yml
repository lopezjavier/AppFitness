name: e2e

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
# NO workflow-level `paths` / `paths-ignore` (ADR-20): a workflow skipped that way never
# creates its check run, so a required check would stay "Expected - waiting" forever.
# The push to `main` matters: caches saved on main are readable by every PR, caches saved on a
# PR only by that PR. The main run seeds the AVD snapshot and Gradle caches.

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }} # never cancel main runs

env:
  # Maestro CLI version, pinned to the one on the dev machine (`maestro --version`).
  # Dependabot does not track it: bump it by hand.
  MAESTRO_VERSION: '2.11.0'
  # Emulator config (single source). Local AVD: Medium_Phone_API_37.0.
  # API level fallback order, if the image does not exist on the runner (ADR-23):
  #   1. 37 google_apis x86_64 (matches compileSdk/targetSdk 37, ADR-21)
  #   2. 37 default x86_64 (no Google services; no E1 flow needs them)
  #   3. 36 google_apis x86_64 (newest image with a long CI track record; the app runs on it)
  # Recent SDK packages carry a minor version: `37` fails ("Failed to find package
  # 'platforms;android-37'"). Verified in the Google SDK repository XML (2026-10-13):
  # platforms;android-37.0 and system-images;android-37.0;google_apis;x86_64 exist, and
  # emulator-runner builds both ids as android-${api-level}, so api-level is `37.0`.
  # AVD_PROFILE falls back to pixel_6 if `avdmanager list device` on the runner lacks medium_phone.
  API_LEVEL: '37.0'
  AVD_TARGET: google_apis
  AVD_ARCH: x86_64
  AVD_PROFILE: medium_phone

jobs:
  changes:
    name: changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read # paths-filter lists PR files through the API
    outputs:
      e2e: ${{ steps.filter.outputs.e2e }}
    steps:
      - uses: actions/checkout@v7 # needed for push events (git-based diff)
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          # Inclusion filter because the run is expensive. Trade-off: a new top-level source
          # directory (or a new file the app build depends on) must be added to this list.
          filters: |
            e2e:
              - 'androidApp/**'
              - 'composeApp/**'
              - 'shared/**'
              - 'tests/e2e/**'
              - 'gradle/**'
              - '*.gradle.kts'
              - 'gradle.properties'
              - '.github/workflows/e2e.yml'
              - 'scripts/e2e-*.sh'
              - 'scripts/check-e2e-shards.sh'

  build-apk:
    name: e2e-build
    needs: changes
    # Fail-open (ADR-20): if `changes` fails its output is empty (!= 'false'), so the run continues.
    if: ${{ !cancelled() && (github.event_name == 'workflow_dispatch' || needs.changes.outputs.e2e != 'false') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # No secrets: the `local` flavor points to 10.0.2.2 and the E1 flows make no backend calls.
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      # Plain bash before the JDK: fails fast if a flow is in no shard or in two.
      - name: E2E shards guard
        run: bash scripts/check-e2e-shards.sh
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21' # ADR-18
      - uses: gradle/actions/setup-gradle@v6
      - name: Assemble localDebug APK
        run: ./gradlew :androidApp:assembleLocalDebug
      - uses: actions/upload-artifact@v7
        with:
          name: e2e-apk
          path: androidApp/build/outputs/apk/local/debug/androidApp-local-debug.apk
          if-no-files-found: error
          retention-days: 3

  shard:
    name: e2e-shard-${{ matrix.shard }}
    needs: [changes, build-apk]
    if: ${{ !cancelled() && needs.build-apk.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        # Balanced by measured local flow time (s): 1 = 126+15, 2 = ~95+44, 3 = 53+55+49.
        # Rebalance from the CI step summaries (and again after T-033). QA adds new flows here
        # (lightest shard); scripts/check-e2e-shards.sh fails the build if one is missed.
        include:
          - shard: 1
            flows: tests/e2e/T-025.yaml tests/e2e/T-020.yaml
          - shard: 2
            flows: tests/e2e/T-026.yaml tests/e2e/T-023.yaml
          - shard: 3
            flows: tests/e2e/T-024.yaml tests/e2e/T-022.yaml tests/e2e/T-021.yaml
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: actions/setup-java@v6 # Maestro needs a JVM
        with:
          distribution: temurin
          java-version: '21'
      - name: Install Maestro
        run: |
          curl -fsSL "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"
      - uses: actions/download-artifact@v7
        with:
          name: e2e-apk
          path: apk
      - name: AVD cache
        id: avd-cache
        uses: actions/cache@v5
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: avd-${{ env.API_LEVEL }}-${{ env.AVD_TARGET }}-${{ env.AVD_ARCH }}-${{ env.AVD_PROFILE }}-v1
      # Cache miss only. Shards race on a miss: the first save wins, the others log a harmless
      # "cache already exists".
      - name: Generate AVD snapshot
        if: steps.avd-cache.outputs.cache-hit != 'true'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ env.API_LEVEL }}
          target: ${{ env.AVD_TARGET }}
          arch: ${{ env.AVD_ARCH }}
          profile: ${{ env.AVD_PROFILE }}
          force-avd-creation: false
          disable-animations: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: echo "AVD snapshot generated"
      - name: Run flows
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ env.API_LEVEL }}
          target: ${{ env.AVD_TARGET }}
          arch: ${{ env.AVD_ARCH }}
          profile: ${{ env.AVD_PROFILE }}
          cores: 4
          force-avd-creation: false
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          # Single line: emulator-runner runs each line of `script:` as a separate `sh -c`.
          script: bash scripts/e2e-run-shard.sh apk/androidApp-local-debug.apk ${{ matrix.flows }}
      - name: Upload screenshots and Maestro output
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-shard-${{ matrix.shard }}
          path: tests/e2e/screenshots/
          if-no-files-found: warn
          retention-days: 14

  e2e:
    name: e2e # <- the check context if it becomes required; never rename without updating the ruleset
    needs: [changes, build-apk, shard]
    if: ${{ !cancelled() && (github.event_name == 'workflow_dispatch' || needs.changes.outputs.e2e != 'false') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check build and shards
        env:
          BUILD_RESULT: ${{ needs.build-apk.result }}
          SHARD_RESULT: ${{ needs.shard.result }}
        run: |
          echo "build-apk: $BUILD_RESULT"
          echo "shard: $SHARD_RESULT"
          [ "$BUILD_RESULT" = "success" ] && [ "$SHARD_RESULT" = "success" ]
