version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
  - package-ecosystem: gradle
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: chore
    ignore:
      # compose-rules >= 0.5 requires detekt 2.x (alpha-only as of 2026-10-12); we stay on
      # detekt 1.23.8. Remove this rule when detekt 2 is stable (see PR #11).
      - dependency-name: "io.nlopez.compose.rules:detekt"
        versions: [">= 0.5.0"]
